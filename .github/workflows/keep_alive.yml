name: Keep Backend Server Alive

on:
  schedule:
    # Ping every 5 minutes to prevent idle machine auto-pause
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Dolly Backend Health Endpoint
        run: |
          STATUS=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 15 "https://8010-agq5qlr2uletnjyzudtddvxrdq.instabox.tech/api/v1/health/" || echo "000")
          echo "HTTP Status: $STATUS"
          cat /tmp/health.json || true
          if [ "$STATUS" != "200" ]; then
            echo "Warning: Server returned status $STATUS (may be paused or restarting)"
          fi
