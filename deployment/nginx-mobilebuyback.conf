server {
    listen 80;
    server_name buyback.yourdomain.com; # Replace with your domain / subdomain

    # Gzip Compression for high-throughput responses
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        image/svg+xml;

    # React Frontend static files
    root /data/home/mobilebuyback_frontend/dist;
    index index.html;

    # Client-side routing for React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Django Gunicorn on port 8010
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;

        # Allow large Base64 image payload uploads for payment proofs & photos
        client_max_body_size 50M;
    }

    # Proxy Django Admin
    location /admin/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # Django Static Assets
    location /static/ {
        alias /data/home/mobile_resell/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
