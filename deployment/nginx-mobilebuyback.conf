server {
    listen 80;
    server_name buyback.yourdomain.com; # Replace with your domain / subdomain

    # React Frontend static files
    root /data/home/mobilebuyback_frontend/dist;
    index index.html;

    # Client-side routing for React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Django Gunicorn on port 8010
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow large Base64 image payload uploads for payment proofs & photos
        client_max_body_size 50M;
    }

    # Proxy Django Admin
    location /admin/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Static Assets
    location /static/ {
        alias /data/home/mobilebuyback_backend/staticfiles/;
    }
}
